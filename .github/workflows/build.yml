name: Build Mac app

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          which xcodegen || brew install xcodegen
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Generate project
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -workspace YMPlayer.xcworkspace -scheme YMPlayer -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          test -d "build/Build/Products/Release/YM Player.app"

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:" build.log | sort -u | head -40)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=Build failed::$msg"

      - name: Package
        run: |
          APP="build/Build/Products/Release/YM Player.app"
          codesign --force --deep -s - "$APP"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "YM Player" -srcfolder dmg -ov -format UDZO YMPlayer.dmg

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YM Player for Mac 1.0.${{ github.run_number }}
          files: YMPlayer.dmg
          make_latest: true

      - name: Test build name
        if: github.ref == 'refs/heads/dev'
        run: cp YMPlayer.dmg YMPlayer-test.dmg

      - name: Publish test build
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Test build (dev branch)
          body: "Latest test build from the dev branch (run ${{ github.run_number }}). Not a release."
          files: YMPlayer-test.dmg
          prerelease: true
          make_latest: false
